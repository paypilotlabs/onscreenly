name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress, so it
# stops holding runners that the newer run is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job runs the suite on Node 22 and then Node 24, so each push needs a
  # single Ubuntu runner. With one job per version, a runner shortage left one
  # of them queued until it was cancelled without running a test.
  test:
    name: Test (Node 22 and 24)
    runs-on: ubuntu-latest
    # The suite takes about a minute per Node version. The limit also counts
    # time spent waiting for a hosted runner.
    timeout-minutes: 30

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar
          for file in app/**/*.js preload.js electron-builder.cjs playwright.config.js renderer/*.js src/**/*.js scripts/**/*.js test/**/*.js e2e/**/*.js e2e/*.cjs; do
            node --check "$file"
          done

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run tests on Node 22
        run: npm test

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests on Node 24
        run: node --version && npm test

  # The real Electron app driven by Playwright: launch, keys, answers with a
  # stand-in provider, résumé analysis, Obsidian notes and the IPC boundary.
  # Linux only here; the release workflow runs the same tests on macOS and
  # Windows before it builds (their runner minutes cost more).
  app-tests:
    name: App tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the app tests
        run: xvfb-run -a npm run test:e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: playwright-report/
          retention-days: 7

      # Screenshots of the main states from e2e/screens.spec.js, for review.
      - name: Keep the UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: test-results/ui/*.png
          if-no-files-found: ignore
          retention-days: 7

  package-windows:
    name: Package Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Windows app
        run: npm run pack:win

  # Exercises the local whisper runtime end to end: download, checksum, launch.
  #
  # Limited to pushes and to PRs labelled whisper-runtime, because it needs the
  # network and would otherwise sit on the critical path of every unrelated change.
  #
  # macOS is deliberately not in this matrix. Windows and Linux fetch immutable
  # GitHub *release assets*, so their pinned checksums hold. macOS builds from
  # source via https://github.com/.../archive/refs/tags/<tag>.zip — a GitHub
  # auto-generated archive, which is NOT byte-stable: GitHub can recompress it,
  # the SHA-256 changes, and the pin fails permanently through no fault of ours.
  # That is exactly what happened here. Re-adding macOS needs the source archive
  # mirrored somewhere immutable first, not a fresh hash that will rot again.
  runtime-smoke:
    name: Local runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'whisper-runtime')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore prepared runtime
        uses: actions/cache@v4
        with:
          path: .cache/whisper-runtime
          key: whisper-runtime-1.9.1-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare pinned runtime
        run: npm run prepare:whisper

      - name: Launch runtime smoke test
        run: npm run verify:whisper-runtime
