name: Bug report
description: Something in Onscreenly doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste API keys, real transcripts, screenshots of private meetings or personal documents.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → Audio
        2. Choose Local
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Onscreenly version
      placeholder: "0.2.4, or the commit if built from source"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 15.1, Windows 11 24H2, Ubuntu 24.04"
  - type: input
    id: provider
    attributes:
      label: Answer and speech providers
      placeholder: "Answers: Anthropic · Speech: local Whisper"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove anything private first.
